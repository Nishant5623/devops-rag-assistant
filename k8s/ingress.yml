# Defined and schema-validated in CI, but NOT exercised end to end: the kind job
# installs no ingress controller and no devops-rag-tls secret, so nothing ever
# serves rag.example.com. Host and TLS secret are illustrative only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-rag-assistant
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rag.example.com
      secretName: devops-rag-tls
  rules:
    - host: rag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-rag-assistant
                port:
                  name: http
