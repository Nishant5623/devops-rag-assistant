apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-rag-assistant
  labels:
    app: devops-rag-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-rag-assistant
  template:
    metadata:
      labels:
        app: devops-rag-assistant
    spec:
      serviceAccountName: devops-rag-assistant
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        # Required by the namespace's pod-security "restricted" policy below.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/nishant5623/devops-rag-assistant:latest
          imagePullPolicy: IfNotPresent
          # The namespace enforces the restricted Pod Security Standard, which
          # rejects pods that allow privilege escalation or keep capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: devops-rag-config
            - secretRef:
                name: devops-rag-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          livenessProbe:
            # Pure liveness: /api/v1/live is index-agnostic and always 200, so a
            # pod is never restarted merely because the index is rebuilding.
            # /api/v1/health returns 503 when the index is not loaded.
            httpGet:
              path: /api/v1/live
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # /ready returns 503 until the vector index is queryable, so a replica
          # whose /app/chroma_store volume is empty never takes traffic.
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # The app re-ingests on startup and /api/v1/health returns 503 until
          # that index is loaded, so startupProbe gates the pod on a usable
          # index (and restarts it if ingestion never succeeds).
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /app/chroma_store
      volumes:
        # A writable dir for Chroma. It also shadows the index baked into the
        # image, which is why the app re-ingests on startup (AUTO_INGEST).
        - name: data
          emptyDir: {}
