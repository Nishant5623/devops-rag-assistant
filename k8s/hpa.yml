# Defined and schema-validated in CI, but NOT exercised: the kind job does not
# install metrics-server, so this HPA can never read CPU (targets show
# <unknown>). It is applied to the cluster but never actually scales anything.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-rag-assistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-rag-assistant
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
