name: devops-rag-assistant

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-rag-assistant:latest
    container_name: rag-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: development
      LOG_LEVEL: INFO
      WORKERS: "1"
      # Leave ANTHROPIC_API_KEY unset to run in keyless/extractive mode.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: "*"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - rag_data:/app/chroma_store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rag-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rag-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  rag_data:
  prometheus_data:
  grafana_data:
