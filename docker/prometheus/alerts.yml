groups:
  - name: devops-rag
    rules:
      - alert: RAGServiceDown
        expr: up{job="devops-rag"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RAG service is down"
          description: "{{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate"
          description: "5xx error rate exceeded 10% over the last 5 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency"
          description: "p95 request latency exceeded 5 seconds over the last 5 minutes."

      - alert: RateLimitHits
        expr: increase(slowapi_requests_blocked_total[5m]) > 0
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Requests blocked by rate limiter"
          description: "Clients are being rate-limited; consider scaling or tuning limits."
