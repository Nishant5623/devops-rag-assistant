[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-rag-assistant"
version = "2.0.0"
description = "A production-ready Retrieval-Augmented Generation (RAG) assistant for DevOps knowledge using FastAPI, LangChain, and ChromaDB."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Nishant", email = "nishant5623@users.noreply.github.com" },
]
keywords = ["rag", "fastapi", "chromadb", "langchain", "devops", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "anthropic>=1.2.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain-anthropic>=1.7.0",
    "langchain-text-splitters>=1.1.2",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.10",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]
otel = [
    "opentelemetry-api>=1.26.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-sdk>=1.26.0",
]
load = [
    "locust>=2.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "S301",  # pickle usage is intentional and controlled
    "S403",  # pickle import warnings
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the standard assertion mechanism in pytest test files.
"tests/*" = ["S101", "S105", "S106", "S303"]
"tests/test_embeddings.py" = ["B011"]
"evaluation/*" = ["E402", "E501"]
"loadtest/*" = []

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
# Keep strict typing but allow untyped defs for third-party-heavy glue code
# (middleware hooks, chromadb/langchain wrappers) which are hard to fully stub.
check_untyped_defs = true

# chromadb ships incomplete stubs (PersistentClient / Collection are typed as
# generic functions with dynamic members); keep us type-safe but don't fight
# the generated stubs.
[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*"]
ignore_errors = true

# langchain stubs are autogenerated and lag the runtime API.
[[tool.mypy.overrides]]
module = ["langchain_anthropic", "langchain_core", "langchain_anthropic.*", "langchain_core.*"]
ignore_errors = true

# slowapi's rate-limit handler is typed for a narrower callable in its stub.
[[tool.mypy.overrides]]
module = ["slowapi", "slowapi.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# Bandit (security) — intentional, documented exceptions.
# ---------------------------------------------------------------------------
# - pickle (B301/B403): we only load/save our own TfidfVectorizer from a
#   controlled, trusted local path at ingestion/query time, never untrusted input.
# - bind-all-interfaces (B104): the server must accept container/external
#   traffic; the container network boundary is the trust boundary.
[tool.bandit]
exclude_dirs = ["tests", "evaluation", "loadtest"]
# For the sake of safety we skip the specific, documented rules rather than
# sprinkle `# nosec` across the codebase.
skips = ["B104", "B301", "B403"]

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --tb=short"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring a running index",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_covered = true
