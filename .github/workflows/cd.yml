name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Serialize deploys: never cancel a deploy that is already in flight just
# because a newer commit arrived (Render is already building the older one;
# cancelling here would only report a false failure for a deploy that still
# happens). New deploys queue behind the current one.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    env:
      # Override via Settings > Variables if the service URL ever changes.
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL || 'https://devops-rag-assistant.onrender.com' }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set. Add it under"
            echo "::error::Settings > Secrets and variables > Actions, then re-run this job."
            exit 1
          fi
          # Render's deploy hook returns HTTP 200 as soon as the deploy is
          # accepted. Never echo the hook URL: it embeds the deploy key.
          status="$(curl -sS -o /tmp/render_hook.out -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK")"
          echo "Render deploy hook accepted (HTTP ${status})."
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat /tmp/render_hook.out
            exit 1
          fi

      - name: Wait for service to report the deployed commit
        env:
          # On workflow_run, github.sha is the CD workflow's own SHA, not the
          # commit CI ran on. head_sha is the commit that triggered CI and that
          # Render checks out when it builds main.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Waiting for ${RENDER_SERVICE_URL}/health to report sha ${EXPECTED_SHA}"
          for i in $(seq 1 120); do
            body="$(curl -sS --max-time 10 "$RENDER_SERVICE_URL/health" 2>/dev/null || true)"
            reported="$(printf '%s' "$body" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("sha",""))' 2>/dev/null || true)"
            if [ -n "$reported" ] && [ "$reported" = "$EXPECTED_SHA" ]; then
              echo
              echo "Service is live and reports sha $reported (attempt $i)."
              exit 0
            fi
            printf '.'
            sleep 5
          done
          echo
          echo "Service did not report sha ${EXPECTED_SHA} within 10 minutes."
          exit 1
