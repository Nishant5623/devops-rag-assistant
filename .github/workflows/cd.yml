name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Kubernetes (Helm)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION || 'us-east-1' }} \
            --name devops-rag-cluster

      - name: Deploy with Helm
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          helm upgrade --install devops-rag helm/devops-rag-assistant \
            --namespace devops-rag --create-namespace \
            --values helm/devops-rag-assistant/values-production.yaml \
            --set image.tag=${{ github.sha }} \
            --set secrets.adminApiKey="$ADMIN_API_KEY" \
            --set secrets.anthropicApiKey="$ANTHROPIC_API_KEY" \
            --wait --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/devops-rag-assistant \
            -n devops-rag --timeout=2m
          kubectl get pods -n devops-rag -l app=devops-rag-assistant
