name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Serialize deploys: never cancel a deploy that is already in flight just
# because a newer commit arrived (Render is already building the older one;
# cancelling here would only report a false failure for a deploy that still
# happens). New deploys queue behind the current one.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    env:
      # Override via Settings > Variables if the service URL ever changes.
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL || 'https://devops-rag-assistant.onrender.com' }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set. Add it under"
            echo "::error::Settings > Secrets and variables > Actions, then re-run this job."
            exit 1
          fi
          # Render's deploy hook returns HTTP 200 as soon as the deploy is
          # accepted. Never echo the hook URL: it embeds the deploy key.
          status="$(curl -sS -o /tmp/render_hook.out -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK")"
          echo "Render deploy hook accepted (HTTP ${status})."
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat /tmp/render_hook.out
            exit 1
          fi

      - name: Wait for service to become ready
        run: |
          set -euo pipefail
          echo -n "Waiting for ${RENDER_SERVICE_URL}/api/v1/ready"
          for i in $(seq 1 120); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              "$RENDER_SERVICE_URL/api/v1/ready" || true)"
            if [ "$code" = "200" ]; then
              echo " service is ready (attempt $i)."
              exit 0
            fi
            printf '.'
            sleep 5
          done
          echo
          echo "Service did not report ready within 10 minutes."
          exit 1
