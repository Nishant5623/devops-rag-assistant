name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual dispatch for ad-hoc checks.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit

      - name: Run ruff
        run: ruff check .

      - name: Check ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy app

      - name: Run bandit (security)
        run: bandit -c pyproject.toml -r app -q

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # pyyaml is only used by tests/test_render_deploy.py to parse
          # render.yaml. It is deliberately not a runtime dependency.
          pip install pytest-cov pyyaml

      - name: Build index
        run: python -m app.ingest

      - name: Run tests with coverage
        # Threshold matches [tool.coverage.report] fail_under in pyproject.toml.
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Generate coverage HTML report
        # Produces htmlcov/ so the artifact upload below has files to attach.
        run: coverage html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  infra:
    name: Infra config (Terraform + Helm + manifests)
    runs-on: ubuntu-latest
    env:
      # Empty unless the repository is configured with AWS credentials. Used
      # only to decide whether the optional `terraform plan` step can run.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        working-directory: terraform/aws
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, no credentials)
        working-directory: terraform/aws
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform/aws
        run: terraform validate

      - name: Terraform plan (only when AWS credentials are configured)
        # A real plan is impossible without an AWS account: the EKS module reads
        # live caller-identity/session data, so provider mocking fails and the
        # provider cannot be configured with fake credentials. When the repo has
        # AWS_ACCESS_KEY_ID/SECRET set, this runs a genuine plan (never apply);
        # otherwise it is skipped and fmt + validate above are the guarantee.
        working-directory: terraform/aws
        env:
          AWS_REGION: us-east-1
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::notice::AWS credentials not configured - skipping terraform plan (fmt + validate already passed)."
            exit 0
          fi
          terraform plan -input=false -no-color -var admin_api_key=ci-plan-only

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm lint
        run: helm lint helm/devops-rag-assistant

      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate the rendered Helm chart
        run: |
          helm template devops-rag helm/devops-rag-assistant \
            -f helm/devops-rag-assistant/values.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.30.0

      - name: Validate the kustomize manifests
        run: |
          kubectl kustomize k8s \
            | kubeconform -strict -summary -kubernetes-version 1.30.0

  kind:
    name: Kind (apply manifests, wait for readiness)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
          node_image: kindest/node:v1.30.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (loaded into the local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/nishant5623/devops-rag-assistant:latest
          cache-from: type=gha,scope=build-${{ hashFiles('requirements.txt', 'Dockerfile') }}
          cache-to: type=gha,scope=build-${{ hashFiles('requirements.txt', 'Dockerfile') }},mode=max

      - name: Load the image into kind
        run: kind load docker-image ghcr.io/nishant5623/devops-rag-assistant:latest --name ci

      - name: Apply the kustomize manifests
        run: kubectl apply -k k8s

      - name: Wait for the Deployment to become Ready
        run: |
          kubectl -n devops-rag rollout status deployment/devops-rag-assistant --timeout=240s
          kubectl -n devops-rag get pods -o wide

      - name: Prove the app answers through the Service
        run: |
          set -euo pipefail
          kubectl -n devops-rag port-forward svc/devops-rag-assistant 18080:80 >/tmp/port-forward.log 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/v1/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "ready:  $(curl -fsS http://127.0.0.1:18080/api/v1/ready)"
          echo "health: $(curl -fsS http://127.0.0.1:18080/health)"
          curl -fsS -X POST http://127.0.0.1:18080/api/v1/ask \
            -H 'Content-Type: application/json' \
            -d '{"question": "What is a Kubernetes Deployment?", "k": 2}'

  docker:
    name: Build, scan & push image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image-name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute build timestamp
        # Stamped into the image (BUILD_TIME build arg) and reported on /health,
        # so an operator can tell exactly which artifact is live.
        id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ONE build, loaded into the local Docker daemon. It is not pushed yet:
      # the image Trivy scans below is exactly this locally-loaded image, and
      # the push step below pushes that same image object. There is no second
      # build. (Previously the image was pushed first and scanned after, so a
      # vulnerable image reached GHCR even though the job then failed.)
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          tags: |
            ${{ steps.image-name.outputs.name }}:${{ github.sha }}
            ${{ steps.image-name.outputs.name }}:latest
          # Scope the gha cache by dependency manifest: any change to
          # requirements.txt or the Dockerfile changes the scope, which forces a
          # fresh (uncached) build so a stale venv layer can never silently ship
          # outdated, vulnerable packages past the Trivy gate.
          cache-from: type=gha,scope=build-${{ hashFiles('requirements.txt', 'Dockerfile') }}
          cache-to: type=gha,scope=build-${{ hashFiles('requirements.txt', 'Dockerfile') }},mode=max

      # Print the Docker image ID (sha256 of the image config) of the exact
      # image object Trivy is about to scan. Compare it with the pushed digest
      # from the logs below and with the GHCR verification step.
      - name: Record the image ID Trivy will scan
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        run: |
          image_id="$(docker inspect --format '{{.Id}}' "${IMAGE_NAME}:${{ github.sha }}")"
          echo "Trivy will scan ${IMAGE_NAME}:${{ github.sha }} (image ID ${image_id})"
          echo "SCANNED_IMAGE_ID=${image_id}" >> "$GITHUB_ENV"

      - name: Run Trivy vulnerability scanner (gates the push)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image-name.outputs.name }}:${{ github.sha }}
          format: table
          # Gate on HIGH and CRITICAL, fixable only: anything at or above HIGH
          # fails this job, so the image never reaches GHCR or Render. Scan the
          # locally-loaded image, not the pushed tag, so nothing unpushed can
          # enter the registry before the gate reports.
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # Prove the tooling-free runtime actually boots: the image no longer
      # ships pip/setuptools/wheel (removed in the Dockerfile), so if the app
      # or any dependency imported them at run time, uvicorn would fail to come
      # up and this step would catch it before the image is pushed.
      - name: Smoke-test the image (runtime boots without packaging tooling)
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        run: |
          cid="$(docker run -d -e PORT=8000 -p 18000:8000 "${IMAGE_NAME}:${{ github.sha }}")"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/v1/live >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs "$cid" || true
          docker rm -f "$cid" >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then echo "::error::Container did not become healthy"; exit 1; fi
          echo "::notice::Container served /api/v1/live OK without pip/setuptools/wheel"

      # Pushes the SAME local image object Trivy scanned. The guard asserts the
      # tag still resolves to the exact scanned image ID, so a rebuild between
      # scan and push is impossible by construction.
      - name: Push the scanned image to GHCR
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        run: |
          current_id="$(docker inspect --format '{{.Id}}' "${IMAGE_NAME}:${{ github.sha }}")"
          if [ -z "${SCANNED_IMAGE_ID:-}" ] || [ "$current_id" != "$SCANNED_IMAGE_ID" ]; then
            echo "::error::Image changed between scan and push (${SCANNED_IMAGE_ID:-none} -> ${current_id})"
            exit 1
          fi
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:latest"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${{ github.sha }}")"
          echo "::notice::Pushed scanned image (ID ${current_id}) as ${digest}"

      # Byte-identity check against the registry: the config digest inside the
      # manifest GHCR now serves for tag <sha> must equal the scanned image ID
      # recorded above. Proves malware cannot have been swapped in registry-side.
      - name: Verify GHCR tag is byte-identical to the scanned image
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          image = os.environ["IMAGE_NAME"]
          tag = "${{ github.sha }}"
          repo = image.split("ghcr.io/")[1]
          token = json.load(urllib.request.urlopen(
              "https://ghcr.io/token?scope=repository:" + repo + ":pull"
          ))["token"]
          accept = ", ".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])

          def fetch(ref):
              req = urllib.request.Request(
                  "https://ghcr.io/v2/" + repo + "/manifests/" + ref,
                  headers={"Authorization": "Bearer " + token, "Accept": accept},
              )
              return json.load(urllib.request.urlopen(req))

          manifest = fetch(tag)
          while "manifests" in manifest:
              entry = next(
                  m for m in manifest["manifests"]
                  if m["platform"]["architecture"] == "amd64"
              )
              manifest = fetch(entry["digest"])

          config_digest = manifest["config"]["digest"]
          expected = os.environ["SCANNED_IMAGE_ID"]
          print("GHCR config digest for :" + tag + " -> " + config_digest)
          if config_digest != expected:
              print("::error::GHCR tag does not match the scanned image (scanned "
                    + expected + ", registry has " + config_digest + ")")
              raise SystemExit(1)
          print("Verified: image in GHCR is byte-identical to the one Trivy scanned.")
          PY
