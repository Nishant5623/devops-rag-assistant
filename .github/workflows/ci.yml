name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual dispatch for ad-hoc checks.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit

      - name: Run ruff
        run: ruff check .

      - name: Check ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy app

      - name: Run bandit (security)
        run: bandit -c pyproject.toml -r app -q

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # pyyaml is only used by tests/test_render_deploy.py to parse
          # render.yaml. It is deliberately not a runtime dependency.
          pip install pytest-cov pyyaml

      - name: Build index
        run: python -m app.ingest

      - name: Run tests with coverage
        # Threshold matches [tool.coverage.report] fail_under in pyproject.toml.
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Generate coverage HTML report
        # Produces htmlcov/ so the artifact upload below has files to attach.
        run: coverage html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  infra:
    name: Infra config (Terraform + Helm + manifests)
    runs-on: ubuntu-latest
    env:
      # Empty unless the repository is configured with AWS credentials. Used
      # only to decide whether the optional `terraform plan` step can run.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        working-directory: terraform/aws
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, no credentials)
        working-directory: terraform/aws
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform/aws
        run: terraform validate

      - name: Terraform plan (only when AWS credentials are configured)
        # A real plan is impossible without an AWS account: the EKS module reads
        # live caller-identity/session data, so provider mocking fails and the
        # provider cannot be configured with fake credentials. When the repo has
        # AWS_ACCESS_KEY_ID/SECRET set, this runs a genuine plan (never apply);
        # otherwise it is skipped and fmt + validate above are the guarantee.
        working-directory: terraform/aws
        env:
          AWS_REGION: us-east-1
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::notice::AWS credentials not configured - skipping terraform plan (fmt + validate already passed)."
            exit 0
          fi
          terraform plan -input=false -no-color -var admin_api_key=ci-plan-only

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm lint
        run: helm lint helm/devops-rag-assistant

      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate the rendered Helm chart
        run: |
          helm template devops-rag helm/devops-rag-assistant \
            -f helm/devops-rag-assistant/values.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.30.0

      - name: Validate the kustomize manifests
        run: |
          kubectl kustomize k8s \
            | kubeconform -strict -summary -kubernetes-version 1.30.0

  kind:
    name: Kind (apply manifests, wait for readiness)
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
          node_image: kindest/node:v1.30.0

      - name: Download the image the docker job built and scanned
        uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Load the scanned image into Docker and kind
        # The exact image the docker job built, Trivy-scanned and smoke tested:
        # it is downloaded and loaded, never rebuilt, so the cluster runs the
        # bytes that passed the gate. The :latest tag is added because the
        # manifests reference it and imagePullPolicy: IfNotPresent would
        # otherwise try to pull from GHCR.
        run: |
          set -euo pipefail
          gunzip -c app-image.tar.gz | docker load
          docker tag "ghcr.io/nishant5623/devops-rag-assistant:${GITHUB_SHA}" \
            ghcr.io/nishant5623/devops-rag-assistant:latest
          kind load docker-image ghcr.io/nishant5623/devops-rag-assistant:latest --name ci
          docker inspect --format 'kind image ID: {{.Id}}' \
            ghcr.io/nishant5623/devops-rag-assistant:latest

      - name: Apply the kustomize manifests
        run: kubectl apply -k k8s

      - name: Wait for the Deployment to become Ready
        run: |
          kubectl -n devops-rag get pods -o wide
          if ! kubectl -n devops-rag rollout status deployment/devops-rag-assistant --timeout=240s; then
            echo "::group::why the rollout did not finish"
            kubectl -n devops-rag get pods -o wide
            kubectl -n devops-rag get events --sort-by=.lastTimestamp | tail -40
            for pod in $(kubectl -n devops-rag get pods -o name); do
              echo "--- describe $pod ---"
              kubectl -n devops-rag describe "$pod" || true
              echo "--- logs $pod ---"
              kubectl -n devops-rag logs "$pod" --all-containers --tail=100 || true
              echo "--- previous logs $pod ---"
              kubectl -n devops-rag logs "$pod" --all-containers --previous --tail=100 || true
            done
            echo "::endgroup::"
            exit 1
          fi
          kubectl -n devops-rag get pods -o wide

      - name: Prove the app answers through the Service
        run: |
          set -euo pipefail
          kubectl -n devops-rag port-forward svc/devops-rag-assistant 18080:80 >/tmp/port-forward.log 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/v1/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "ready:  $(curl -fsS http://127.0.0.1:18080/api/v1/ready)"
          echo "health: $(curl -fsS http://127.0.0.1:18080/health)"
          curl -fsS -X POST http://127.0.0.1:18080/api/v1/ask \
            -H 'Content-Type: application/json' \
            -d '{"question": "What is a Kubernetes Deployment?", "k": 2}'

      - name: Install the Helm chart into a second namespace
        # Proves the chart actually installs, not just renders. The namespace is
        # created and labelled first: Helm stores its release metadata in it, and
        # the chart only creates it itself when namespaceCreate=true.
        run: |
          set -euo pipefail
          kubectl create namespace devops-rag-helm
          kubectl label namespace devops-rag-helm pod-security.kubernetes.io/enforce=restricted
          helm install rag helm/devops-rag-assistant \
            --namespace devops-rag-helm \
            --set namespace=devops-rag-helm \
            --wait --timeout 180s
          kubectl -n devops-rag-helm get pods -o wide
          kubectl -n devops-rag-helm port-forward svc/devops-rag-assistant 18081:80 >/tmp/pf-helm.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/api/v1/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "helm-ready: $(curl -fsS http://127.0.0.1:18081/api/v1/ready)"
          helm status rag -n devops-rag-helm | head -6

  docker:
    name: Build & scan image (push on main)
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Runs on every push and PR so the kind and monitoring jobs can reuse ONE
    # built-and-scanned image instead of rebuilding it. The GHCR login, push and
    # byte-identity verification steps below are main-only.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image-name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute build timestamp
        # Stamped into the image (BUILD_TIME build arg) and reported on /health,
        # so an operator can tell exactly which artifact is live.
        id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ONE build, loaded into the local Docker daemon. It is not pushed yet:
      # the image Trivy scans below is exactly this locally-loaded image, and
      # the push step below pushes that same image object. There is no second
      # build. (Previously the image was pushed first and scanned after, so a
      # vulnerable image reached GHCR even though the job then failed.)
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          tags: |
            ${{ steps.image-name.outputs.name }}:${{ github.sha }}
            ${{ steps.image-name.outputs.name }}:latest
          # Scope the gha cache by dependency manifest: any change to
          # requirements.txt or the Dockerfile changes the scope, which forces a
          # fresh (uncached) build so a stale venv layer can never silently ship
          # outdated, vulnerable packages past the Trivy gate.
          cache-from: type=gha,scope=build-${{ hashFiles('requirements.txt', 'Dockerfile') }}
          cache-to: type=gha,scope=build-${{ hashFiles('requirements.txt', 'Dockerfile') }},mode=max

      # Print the Docker image ID (sha256 of the image config) of the exact
      # image object Trivy is about to scan. Compare it with the pushed digest
      # from the logs below and with the GHCR verification step.
      - name: Record the image ID Trivy will scan
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        run: |
          image_id="$(docker inspect --format '{{.Id}}' "${IMAGE_NAME}:${{ github.sha }}")"
          echo "Trivy will scan ${IMAGE_NAME}:${{ github.sha }} (image ID ${image_id})"
          echo "SCANNED_IMAGE_ID=${image_id}" >> "$GITHUB_ENV"

      - name: Run Trivy vulnerability scanner (gates the push)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image-name.outputs.name }}:${{ github.sha }}
          format: table
          # Gate on HIGH and CRITICAL, fixable only: anything at or above HIGH
          # fails this job, so the image never reaches GHCR or Render. Scan the
          # locally-loaded image, not the pushed tag, so nothing unpushed can
          # enter the registry before the gate reports.
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # Prove the tooling-free runtime actually boots: the image no longer
      # ships pip/setuptools/wheel (removed in the Dockerfile), so if the app
      # or any dependency imported them at run time, uvicorn would fail to come
      # up and this step would catch it before the image is pushed.
      - name: Smoke-test the image (runtime boots without packaging tooling)
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        run: |
          cid="$(docker run -d -e PORT=8000 -p 18000:8000 "${IMAGE_NAME}:${{ github.sha }}")"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/v1/live >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs "$cid" || true
          docker rm -f "$cid" >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then echo "::error::Container did not become healthy"; exit 1; fi
          echo "::notice::Container served /api/v1/live OK without pip/setuptools/wheel"

      # Pushes the SAME local image object Trivy scanned. The guard asserts the
      # tag still resolves to the exact scanned image ID, so a rebuild between
      # scan and push is impossible by construction.
      - name: Push the scanned image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        run: |
          current_id="$(docker inspect --format '{{.Id}}' "${IMAGE_NAME}:${{ github.sha }}")"
          if [ -z "${SCANNED_IMAGE_ID:-}" ] || [ "$current_id" != "$SCANNED_IMAGE_ID" ]; then
            echo "::error::Image changed between scan and push (${SCANNED_IMAGE_ID:-none} -> ${current_id})"
            exit 1
          fi
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:latest"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${{ github.sha }}")"
          echo "::notice::Pushed scanned image (ID ${current_id}) as ${digest}"

      # Byte-identity check against the registry: the config digest inside the
      # manifest GHCR now serves for tag <sha> must equal the scanned image ID
      # recorded above. Proves malware cannot have been swapped in registry-side.
      - name: Verify GHCR tag is byte-identical to the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          image = os.environ["IMAGE_NAME"]
          tag = "${{ github.sha }}"
          repo = image.split("ghcr.io/")[1]
          token = json.load(urllib.request.urlopen(
              "https://ghcr.io/token?scope=repository:" + repo + ":pull"
          ))["token"]
          accept = ", ".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])

          def fetch(ref):
              req = urllib.request.Request(
                  "https://ghcr.io/v2/" + repo + "/manifests/" + ref,
                  headers={"Authorization": "Bearer " + token, "Accept": accept},
              )
              return json.load(urllib.request.urlopen(req))

          manifest = fetch(tag)
          while "manifests" in manifest:
              entry = next(
                  m for m in manifest["manifests"]
                  if m["platform"]["architecture"] == "amd64"
              )
              manifest = fetch(entry["digest"])

          config_digest = manifest["config"]["digest"]
          expected = os.environ["SCANNED_IMAGE_ID"]
          print("GHCR config digest for :" + tag + " -> " + config_digest)
          if config_digest != expected:
              print("::error::GHCR tag does not match the scanned image (scanned "
                    + expected + ", registry has " + config_digest + ")")
              raise SystemExit(1)
          print("Verified: image in GHCR is byte-identical to the one Trivy scanned.")
          PY

      - name: Save the scanned image for the kind and monitoring jobs
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        run: |
          set -euo pipefail
          docker save "${IMAGE_NAME}:${{ github.sha }}" | gzip > app-image.tar.gz
          ls -lh app-image.tar.gz

      - name: Upload the scanned image as an artifact
        # ~245 MiB compressed. The kind and monitoring jobs load this exact
        # image instead of building it again, so there is one build per run.
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: app-image.tar.gz
          retention-days: 1
          compression-level: 0

  monitoring:
    name: Observability (compose, Prometheus scrape)
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Download the image the docker job built and scanned
        uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Load the scanned image and tag it for compose
        run: |
          set -euo pipefail
          gunzip -c app-image.tar.gz | docker load
          docker tag "ghcr.io/nishant5623/devops-rag-assistant:${GITHUB_SHA}" \
            devops-rag-assistant:latest

      - name: Start the stack (app + Prometheus + Grafana)
        env:
          ADMIN_API_KEY: dev-admin-key
        run: docker compose up -d --no-build

      - name: Wait for the app to become ready
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "ready: $(curl -fsS http://127.0.0.1:8000/api/v1/ready)"

      - name: Prove /metrics rejects a keyless request
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/metrics)
          echo "GET /metrics without X-Admin-Key -> $code"
          [ "$code" = "401" ] || { echo "::error::/metrics should be 401 without the admin key"; exit 1; }

      - name: Send some /ask traffic
        # Not -f: a 429 from the rate limiter is still traffic worth counting.
        run: |
          set -euo pipefail
          for q in "What is a Kubernetes Deployment?" "What does Terraform manage?" "How does the CI pipeline work?"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://127.0.0.1:8000/api/v1/ask \
              -H 'Content-Type: application/json' \
              -d "{\"question\": \"$q\", \"k\": 2}")
            echo "POST /api/v1/ask -> $code"
          done

      - name: Assert Prometheus reports the app target up
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            up=$(curl -fsS --data-urlencode 'query=up{job="devops-rag"}' \
              http://127.0.0.1:9090/api/v1/query \
              | jq -r '.data.result[0].value[1] // empty')
            if [ "$up" = "1" ]; then echo "Prometheus target is up"; exit 0; fi
            sleep 2
          done
          echo "::error::Prometheus never reported the app target as up"
          curl -fsS http://127.0.0.1:9090/api/v1/targets \
            | jq '.data.activeTargets[] | {scrapeUrl, health, lastError}'
          exit 1

      - name: Assert the request counter increases after more traffic
        run: |
          set -euo pipefail
          query='sum(http_requests_total{job="devops-rag"})'
          before=$(curl -fsS --data-urlencode "query=$query" \
            http://127.0.0.1:9090/api/v1/query | jq -r '.data.result[0].value[1]')
          echo "before: $before"
          for _ in $(seq 1 5); do
            curl -s -o /dev/null -X POST http://127.0.0.1:8000/api/v1/ask \
              -H 'Content-Type: application/json' \
              -d '{"question": "What is a Kubernetes Deployment?", "k": 2}'
          done
          # The scrape interval is 15s: wait one full cycle plus margin.
          sleep 20
          after=$(curl -fsS --data-urlencode "query=$query" \
            http://127.0.0.1:9090/api/v1/query | jq -r '.data.result[0].value[1]')
          echo "after:  $after"
          python3 -c "import sys; b=float('$before'); a=float('$after'); print(f'{b} -> {a}'); sys.exit(0 if a > b else 1)" \
            || { echo "::error::Prometheus counter did not increase"; exit 1; }

      - name: Confirm Grafana provisioned the dashboard
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health | jq .
          curl -fsS -u admin:admin \
            http://127.0.0.1:3000/api/dashboards/uid/devops-rag-assistant \
            | jq -r '.dashboard.title'

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
