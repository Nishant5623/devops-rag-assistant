apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-rag-assistant
  namespace: {{ .Values.namespace }}
  labels:
    app: devops-rag-assistant
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: devops-rag-assistant
  template:
    metadata:
      labels:
        app: devops-rag-assistant
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        # Required by the namespace's pod-security "restricted" policy.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # image.tag is required and is never defaulted here: :latest is
          # mutable, so the chart refuses to render a release until the tag
          # is pinned explicitly (see values-production.yaml).
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required - pin the CI-pushed commit sha, e.g. --set image.tag=<commit-sha>; :latest is demo-only" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The namespace enforces the restricted Pod Security Standard, which
          # rejects pods that allow privilege escalation or keep capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: devops-rag-config
            - secretRef:
                name: devops-rag-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            # Pure liveness: /api/v1/live is index-agnostic and always 200, so a
            # pod is never restarted merely because the index is rebuilding.
            # /api/v1/health returns 503 when the index is not loaded.
            httpGet:
              path: /api/v1/live
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # /ready returns 503 until the vector index is queryable, so a replica
          # whose /app/chroma_store volume is empty never takes traffic.
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # The app re-ingests on startup and /api/v1/health returns 503 until
          # that index is loaded, so startupProbe gates the pod on a usable
          # index before liveness begins judging it.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /app/chroma_store
      volumes:
        # A writable dir for Chroma. It also shadows the index baked into the
        # image, which is why the app re-ingests on startup (AUTO_INGEST).
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devops-rag-assistant
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: devops-rag-assistant
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
