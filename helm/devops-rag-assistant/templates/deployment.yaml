apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-rag-assistant
  namespace: {{ .Values.namespace }}
  labels:
    app: devops-rag-assistant
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: devops-rag-assistant
  template:
    metadata:
      labels:
        app: devops-rag-assistant
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: devops-rag-config
            - secretRef:
                name: devops-rag-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/chroma_store
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devops-rag-assistant
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: devops-rag-assistant
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
