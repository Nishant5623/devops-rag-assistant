apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    # Match the raw k8s/ manifests: enforce the restricted Pod Security Standard
    # so a pod that does not meet it is rejected at admission.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-rag-config
  namespace: {{ .Values.namespace }}
data:
  ENV: {{ .Values.config.env | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AUTO_INGEST: {{ .Values.config.autoIngest | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: devops-rag-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | quote }}
