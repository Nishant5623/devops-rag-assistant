# Default values for devops-rag-assistant.
# WARNING: secrets are overridden via --set / values files in real deployments.

replicaCount: 2

image:
  repository: ghcr.io/nishant5623/devops-rag-assistant
  # DEMO/CI ONLY. :latest is mutable, and IfNotPresent is deliberate: the
  # kind job loads the scanned image locally as :latest, and IfNotPresent
  # keeps kubelet from pulling a different :latest from GHCR. For anything
  # real, pin an immutable tag (see values-production.yaml).
  tag: latest
  pullPolicy: IfNotPresent

namespace: devops-rag

# Render the Namespace object as part of the release. Keep this false when the
# namespace already exists: Helm stores its release metadata in that namespace,
# so it must exist before install, and a chart cannot re-create a namespace it
# does not own (that fails with "already exists"). Set it true only when the
# release lives somewhere else, e.g.
#   helm install rag helm/devops-rag-assistant --namespace helm-meta \
#     --set namespace=devops-rag --set namespaceCreate=true --create-namespace
namespaceCreate: false

serviceAccount:
  name: devops-rag-assistant

config:
  env: production
  logLevel: INFO
  # Rebuild the vector index on startup when it is missing. Required because
  # the emptyDir volume over /app/chroma_store hides the index in the image.
  autoIngest: "True"
  corsOrigins: "https://rag.example.com"

secrets:
  # Leave empty to run keyless/extractive mode. No AI API key is required.
  anthropicApiKey: ""
  # Leave empty to disable auth on /ingest and /metrics. Set a real value in
  # any deployment reachable from outside the cluster.
  adminApiKey: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

# Rendered and schema-validated in CI, but not exercised: the CI kind cluster
# has no metrics-server, so the HPA never receives CPU readings.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

# Rendered and schema-validated in CI, but not exercised end to end: no ingress
# controller or TLS certificate is installed, so the host is illustrative.
ingress:
  enabled: true
  host: rag.example.com
  tlsSecret: devops-rag-tls

podDisruptionBudget:
  enabled: true
  minAvailable: 1
