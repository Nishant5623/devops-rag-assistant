# Example production values. The app runs with NO AI API key in extractive
# mode, so secrets.anthropicApiKey can stay empty. The release namespace must
# exist first (the chart only creates it when namespaceCreate=true), and it is
# what enforces the restricted Pod Security Standard, so label it too:
#   kubectl create namespace devops-rag
#   kubectl label namespace devops-rag pod-security.kubernetes.io/enforce=restricted
#   helm upgrade --install devops-rag helm/devops-rag-assistant \
#     --namespace devops-rag \
#     --values helm/devops-rag-assistant/values-production.yaml \
#     --set secrets.adminApiKey=<your-key> \
#     --set image.tag=<commit-sha>

replicaCount: 3

image:
  repository: ghcr.io/nishant5623/devops-rag-assistant
  # REQUIRED - intentionally empty, so the chart fails to render until it is
  # set. CI pushes two tags to GHCR on every build to main: :<commit-sha>,
  # which is immutable and the one to pin, and :latest, which exists only so
  # demos and the kind job have a tag to pull - it moves on every build.
  # Pin the sha of the CI run you want to deploy, e.g.
  #   --set image.tag=$(git rev-parse HEAD)
  tag: ""
  pullPolicy: Always

config:
  env: production
  logLevel: INFO
  autoIngest: "True"
  corsOrigins: "https://rag.yourdomain.com"

# No AI key required. Set secrets.anthropicApiKey only to upgrade answers from
# extractive to LLM-synthesized.
secrets:
  anthropicApiKey: ""

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  host: rag.yourdomain.com
  tlsSecret: devops-rag-tls

podDisruptionBudget:
  enabled: true
  minAvailable: 2
